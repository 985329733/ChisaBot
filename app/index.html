<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChisaBot · 中文版</title>
    <style>
      /* Pre-JS shell: the same sky and glass skeleton the app draws while routes load, so the first
         paint is never a white page. Kept small and self-contained; styles.css takes over after. */
      html, body { margin: 0; min-height: 100%; }
      body { background-color: #9dbddc; background: radial-gradient(900px 380px at 18% 22%, rgba(255,255,255,.75), transparent 70%), radial-gradient(700px 300px at 72% 12%, rgba(255,255,255,.55), transparent 70%), radial-gradient(1100px 420px at 60% 78%, rgba(255,255,255,.7), transparent 70%), linear-gradient(180deg, #6f9bc7 0%, #9dbddc 38%, #c9dbeb 68%, #e4ecf3 100%); background-attachment: fixed; font-family: "Inter Variable", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      html.dark body { background-color: #12203a; background: radial-gradient(900px 380px at 18% 22%, rgba(120,160,220,.18), transparent 70%), radial-gradient(1100px 420px at 60% 78%, rgba(80,110,170,.16), transparent 70%), linear-gradient(180deg, #0c1626 0%, #12203a 45%, #172a46 75%, #1b304d 100%); background-attachment: fixed; }
      .boot { position: fixed; inset: 0; overflow: hidden; --g: rgba(255,255,255,.34); --gl: rgba(255,255,255,.35); --s1: rgba(255,255,255,.25); --s2: rgba(255,255,255,.75); }
      html.dark .boot { --g: rgba(255,255,255,.07); --gl: rgba(255,255,255,.05); --s1: rgba(255,255,255,.03); --s2: rgba(255,255,255,.09); }
      .boot i { display: block; font-style: normal; }
      .boot .sh { background: linear-gradient(90deg, var(--s1) 0%, var(--s2) 50%, var(--s1) 100%); background-size: 200% 100%; animation: boot-sh 1.6s ease-in-out infinite; border-radius: 999px; }
      .boot .gl { background: var(--g); border: 1px solid var(--gl); -webkit-backdrop-filter: saturate(160%) blur(22px); backdrop-filter: saturate(160%) blur(22px); }
      .boot-top { position: absolute; inset: 14px 16px auto 16px; height: 48px; display: flex; align-items: center; justify-content: space-between; }
      .boot-dot { width: 48px; height: 48px; border-radius: 50% !important; }
      .boot-seg { position: absolute; left: 50%; transform: translateX(-50%); width: 260px; height: 46px; border-radius: 999px; }
      .boot-right { display: flex; gap: 10px; }
      .boot-search { width: 190px; height: 44px; border-radius: 999px; }
      .boot-cols { position: absolute; inset: 76px 16px 16px 16px; display: grid; grid-template-columns: 260px minmax(0,1fr) 356px; gap: 16px; }
      .boot-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
      .boot-card { border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
      .boot-bar { height: 12px; }
      .boot-main { align-items: center; justify-content: flex-end; gap: 16px; padding: 24px 6% 0; }
      .boot-note { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 999px; background: rgba(255,255,255,.8); box-shadow: 0 10px 30px rgba(40,70,110,.12); color: #3b3f48; font-size: 13px; white-space: nowrap; }
      html.dark .boot-note { background: rgba(30,42,60,.82); color: #c7cedb; }
      .boot-note[hidden] { display: none; }
      .boot-note button { height: 30px; padding: 0 14px; border: 0; border-radius: 999px; background: #16181d; color: #fff; font: inherit; font-size: 13px; cursor: pointer; }
      html.dark .boot-note button { background: #e8ecf3; color: #10161f; }
      .boot-note button[hidden] { display: none; }
      @keyframes boot-sh { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
      @media (max-width: 1100px) { .boot-cols { grid-template-columns: 240px minmax(0,1fr); } .boot-cols > :nth-child(3) { display: none; } }
      @media (max-width: 760px) { .boot-cols { grid-template-columns: minmax(0,1fr); } .boot-cols > :first-child, .boot-seg, .boot-search { display: none; } }
      @media (prefers-reduced-motion: reduce) { .boot .sh { animation: none; } }
    </style>
    <!-- Sets the theme before the first paint. Must stay inline and classic: `defer` or `type="module"` runs too late. -->
    <script>
      // localStorage throws in some privacy modes; a theme is not worth taking the app down for.
      try {
        const dark = window.localStorage.getItem("openbot-theme") === "dark";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <!-- Present before the gateway's workspace.js runs its DOMContentLoaded mount, which tells it the
         app draws its own account control (sign-out lives in the avatar menu), so it adds no
         floating "退出登录" button of its own. -->
    <div id="openbot-account-control" hidden></div>
    <div id="root">
      <div id="openbot-startup" class="boot" role="status" aria-label="正在加载 ChisaBot">
        <div class="boot-top">
          <i class="boot-dot sh"></i>
          <i class="boot-seg gl"></i>
          <span class="boot-right"><i class="boot-search gl"></i><i class="boot-dot gl"></i></span>
        </div>
        <div class="boot-cols">
          <div class="boot-col">
            <i class="sh" style="height:46px"></i>
            <div class="boot-card gl"><i class="boot-bar sh" style="width:40%;height:10px"></i><i class="boot-bar sh" style="width:85%"></i><i class="boot-bar sh" style="width:70%"></i><i class="boot-bar sh" style="width:78%"></i></div>
            <div class="boot-card gl" style="flex:1"><i class="boot-bar sh" style="width:30%;height:10px"></i><i class="boot-bar sh" style="width:90%"></i><i class="boot-bar sh" style="width:65%"></i><i class="boot-bar sh" style="width:80%"></i><i class="boot-bar sh" style="width:55%"></i></div>
          </div>
          <div class="boot-col boot-main">
            <i class="boot-bar sh" style="width:34%"></i>
            <i class="boot-bar sh" style="width:52%"></i>
            <i class="gl sh" style="width:min(640px,100%);height:96px;border-radius:22px"></i>
          </div>
          <div class="boot-col">
            <i class="sh" style="width:40%;height:14px;margin-top:14px"></i>
            <div class="boot-card gl"><i class="boot-bar sh" style="width:50%"></i><i class="sh" style="height:64px;border-radius:16px"></i><i class="boot-bar sh" style="width:35%"></i></div>
          </div>
        </div>
        <div id="openbot-startup-note" class="boot-note" hidden>
          <span id="openbot-startup-title">加载时间比平时长一些…</span>
          <span id="openbot-startup-detail" hidden></span>
          <button id="openbot-reload" type="button">重新加载</button>
        </div>
        <noscript><div class="boot-note"><span>请启用浏览器的 JavaScript 后重新加载。</span></div></noscript>
      </div>
    </div>
    <script id="openbot-startup-script">
      // biome-ignore-all lint/complexity/useArrowFunction: Keep the pre-module recovery script compatible with older browsers.
      // biome-ignore-all lint/complexity/useOptionalChain: This must work even when newer module syntax fails to load.
      (function () {
        var startup = document.getElementById("openbot-startup");
        var title = document.getElementById("openbot-startup-title");
        var detail = document.getElementById("openbot-startup-detail");
        var reload = document.getElementById("openbot-reload");
        var note = document.getElementById("openbot-startup-note");
        var failed = false;
        var mounted = false;
        var stage = "shell";
        var id;
        try {
          var random = window.crypto.getRandomValues(new Uint32Array(3));
          id = "boot_" + random[0].toString(16) + "_" + random[1].toString(16) + "_" + random[2].toString(16);
        } catch {
          id = "boot_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 12);
        }
        function resourceName(value) {
          try {
            if (typeof value !== "string" || !value) return;
            var url = new window.URL(value, window.location.href);
            if (url.origin !== window.location.origin || !/^\/(assets|auth|src)\//.test(url.pathname)) return;
            var name = url.pathname.slice(url.pathname.lastIndexOf("/") + 1);
            if (/^[A-Za-z0-9._-]{1,120}$/.test(name)) return name;
          } catch {}
        }
        function sameOrigin(value) {
          try {
            return typeof value === "string" && value.length > 0 && new window.URL(value, window.location.href).origin === window.location.origin;
          } catch { return false; }
        }
        function errorName(value) {
          if (["Error", "TypeError", "ReferenceError", "SyntaxError", "RangeError", "SecurityError", "AbortError"].indexOf(value) !== -1) return value;
        }
        function coordinate(value) {
          if (typeof value === "number" && value >= 0 && value <= 10000000 && Math.floor(value) === value) return value;
        }
        function report(event, resource, category, info) {
          if (mounted || typeof window.fetch !== "function") return;
          try {
            var payload = { id: id, event: event, stage: stage };
            if (resource) payload.resource = resource;
            if (category) payload.category = category;
            if (info) {
              if (info.name) payload.name = info.name;
              if (typeof info.line === "number") payload.line = info.line;
              if (typeof info.column === "number") payload.column = info.column;
            }
            window.fetch("/auth/startup-report", {
              method: "POST",
              credentials: "same-origin",
              keepalive: true,
              cache: "no-store",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }).catch(function () {});
          } catch {}
        }
        function showFailure(event) {
          if (mounted || failed || !startup || !startup.isConnected) return;
          var target = event.target;
          var resource;
          var category;
          var info;
          if (target && (target.tagName === "SCRIPT" || target.tagName === "LINK")) {
            if ((target.tagName === "SCRIPT" && target.type !== "module") || (target.tagName === "LINK" && target.rel !== "stylesheet")) return;
            resource = resourceName(target.src || target.href);
            if (!resource) return;
            category = "resource";
          } else if (event.type === "unhandledrejection") {
            // A blocked third-party beacon must not be mistaken for a failed app.
            var reason = event.reason;
            if (!reason || typeof reason.stack !== "string" || reason.stack.indexOf(window.location.origin + "/assets/") === -1) return;
            category = "promise";
            info = { name: errorName(reason.name) };
          } else {
            if (!sameOrigin(event.filename) || !event.error || typeof event.error.name !== "string") return;
            resource = resourceName(event.filename);
            category = event.error.name === "SyntaxError" ? "syntax" : "runtime";
            info = { name: errorName(event.error.name), line: coordinate(event.lineno), column: coordinate(event.colno) };
          }
          failed = true;
          startup.setAttribute("role", "alert");
          title.textContent = "无法加载 ChisaBot，请检查网络连接";
          note.hidden = false;
          report("error", resource, category, info);
        }
        report("shell");
        reload.addEventListener("click", function () { window.location.reload(); });
        window.addEventListener("error", showFailure, true);
        window.addEventListener("unhandledrejection", showFailure);
        document.addEventListener("load", function (event) {
          var target = event.target;
          if (mounted || failed || !target || target.tagName !== "SCRIPT" || target.type !== "module") return;
          var resource = resourceName(target.src);
          if (!resource) return;
          if (stage === "shell") stage = "entry-loaded";
          report("entry-loaded", resource);
        }, true);
        window.addEventListener("openbot-boot-stage", function (event) {
          if (mounted || (event.detail !== "entry-executing" && event.detail !== "react-mounted")) return;
          stage = event.detail;
          report(stage);
          if (stage === "react-mounted") {
            mounted = true;
            window.clearTimeout(deadline);
            window.clearTimeout(hint);
          }
        });
        // A gentle hint once the load is clearly slow; the diagnostic report still waits for 30s.
        var hint = setTimeout(function () {
          if (mounted || failed || !startup || !startup.isConnected) return;
          note.hidden = false;
        }, 10000);
        var deadline = setTimeout(function () {
          if (mounted || failed || !startup || !startup.isConnected) return;
          title.textContent = "加载时间较长，请检查网络连接";
          note.hidden = false;
          report("timeout");
        }, 30000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
