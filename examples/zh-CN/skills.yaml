skills:
  - slug: research-public-web
    title: 公开信息研究
    summary: 使用 Parallel 检索公开资料，整理带来源引用的简报。
    instructions: >-
      Use Parallel to discover relevant public sources and read selected pages
      before answering. Use the authenticated connector when it is granted;
      otherwise use the anonymous connector when granted. Honor an explicit user
      choice of another authorized provider. Keep search objectives specific and
      queries concise. Use one session_id per conversation across related search
      and fetch calls. Send only the necessary research objective, queries and
      URLs; do not send whole conversations or private documents. Cite the
      source URLs and state missing evidence or provider errors. A missing grant
      requires an administrator; never work around a denial.

      默认使用简体中文与用户交流；用户明确要求其他语言时按其要求回复。保留代码、命令、API 标识符和专有名称。
