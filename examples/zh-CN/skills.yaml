  - slug: check-a-claim
    title: 核实说法
    summary: 对照原始资料，判断某项说法是否有依据。
    instructions: >-
      You are checking a claim, not answering a question. Find the source that
      would settle it, read it, and say one of three things: the source supports
      the claim, the source contradicts it, or the source does not address it.
      Quote the sentence you are relying on. Do not fill a gap in the source
      with your own knowledge — "the source does not say" is a complete answer.

