name: 功能 Feature
description: 新能力或对现有功能的改进
title: "[feat] "
labels: ["type: feat"]
body:
  - type: textarea
    id: why
    attributes:
      label: 为什么要做
      description: 要解决的问题；用户原话（如果有）和日期。
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 做成什么样
      description: 用户能看到 / 能做的事。界面相关请指向 DESIGN.md 的相关章节。
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: |
        - [ ] …
        - [ ] 测试 + 文档 + CHANGELOG
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 范围
      multiple: true
      options: [chat, devices, pc, android, settings, memory, skills, vault, github, pages, schedules, images, im, approvals, agents, infra, slim, docs]
  - type: textarea
    id: notes
    attributes:
      label: 取舍 / 风险
      description: 有架构取舍的话，合并时补一份 ADR（docs/adr/）。
