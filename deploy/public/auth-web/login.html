<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#9dbddc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0c1730" media="(prefers-color-scheme: dark)">
    <title>登录 · ChisaBot</title>
    <link rel="icon" href="/auth/brand/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" href="/auth/brand/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/auth/brand/apple-touch-icon.png">
    <link rel="stylesheet" href="/auth/login.css">
    <script src="/auth/login.js" defer></script>
  </head>
  <body class="chisabot">
    <main class="login-page">
      <section class="brand" aria-label="ChisaBot">
        <a class="brand-mark" href="/login" aria-label="ChisaBot 登录首页">
          <img class="brand-logo" src="/auth/brand/logo.png" alt="" width="40" height="40">
          <span>CHISABOT</span>
        </a>
        <div class="brand-content">
          <p class="eyebrow">你的 AI 工作空间</p>
          <h1>ChisaBot<span class="brand-dot">.</span></h1>
          <p class="brand-description">管理对话、助手与任务。</p>
        </div>
        <svg class="orbit" viewBox="0 0 560 390" fill="none" aria-hidden="true">
          <ellipse cx="282" cy="218" rx="231" ry="110" transform="rotate(-23 282 218)"/>
          <ellipse cx="282" cy="218" rx="184" ry="81" transform="rotate(-23 282 218)"/>
          <path d="M103 281 282 218l179-64M224 124l58 94 57 96"/>
          <defs><clipPath id="orbit-avatar"><circle cx="282" cy="218" r="44"/></clipPath></defs>
          <circle class="orbit-center" cx="282" cy="218" r="50"/>
          <image class="orbit-avatar" href="/auth/brand/logo.png" x="238" y="174" width="88" height="88" clip-path="url(#orbit-avatar)"/>
          <circle class="orbit-node" cx="103" cy="281" r="7"/>
          <circle class="orbit-node orbit-node-accent" cx="461" cy="154" r="7"/>
          <circle class="orbit-node" cx="224" cy="124" r="5"/>
          <circle class="orbit-node" cx="339" cy="314" r="5"/>
        </svg>
        <p class="brand-footer">对话 · 协作 · 创作</p>
      </section>

      <section class="login-section" aria-labelledby="login-heading">
        <div class="login-content">
          <p class="section-label">欢迎回来</p>
          <h2 id="login-heading">登录工作空间</h2>
          <p class="login-description">使用你的账号继续。</p>

          <form id="login-form" action="/auth/login" method="post">
            <div class="field">
              <label for="username">账号</label>
              <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" value="" required maxlength="100">
            </div>
            <div class="field">
              <label for="password">密码</label>
              <div class="password-control">
                <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" aria-describedby="login-error">
                <button id="password-toggle" class="password-toggle" type="button" aria-label="显示密码" aria-pressed="false">显示</button>
              </div>
            </div>
            <div class="login-options">
              <label class="remember" for="remember">
                <input id="remember" name="remember" type="checkbox">
                <span>记住登录</span>
              </label>
            </div>
            <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
            <button id="login-submit" class="login-submit" type="submit">
              <span id="submit-label">登录</span>
              <svg class="submit-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span class="submit-spinner" aria-hidden="true"></span>
            </button>
          </form>
          <form id="invite-form" hidden autocomplete="on">
            <div class="field" id="invite-username-field">
              <label for="invite-username">账号名</label>
              <input id="invite-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" placeholder="以后用它登录，2–32 个字符">
            </div>
            <div class="field" id="invite-name-field">
              <label for="invite-name">怎么称呼你</label>
              <input id="invite-name" name="displayName" type="text" autocomplete="nickname" maxlength="32" placeholder="可选，机器人会这样叫你">
            </div>
            <div class="field">
              <label for="invite-password">密码</label>
              <input id="invite-password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="1024" placeholder="至少 8 位">
            </div>
            <div class="field">
              <label for="invite-confirm">再输一次密码</label>
              <input id="invite-confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="1024">
            </div>
            <p id="invite-error" class="login-error" role="alert" aria-live="polite"></p>
            <button id="invite-submit" class="login-submit" type="submit">
              <span id="invite-label">创建账号并登录</span>
              <svg class="submit-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span class="submit-spinner" aria-hidden="true"></span>
            </button>
          </form>
          <noscript><p class="noscript-message">请启用浏览器的 JavaScript 后登录。</p></noscript>
          <p class="login-note">使用 ChisaBot 客户端（PC / Android）时，在客户端的登录页填写这个服务器地址即可。</p>
        </div>
        <p class="login-footer">ChisaBot 工作空间</p>
      </section>
    </main>
  </body>
</html>
