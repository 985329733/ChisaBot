# 云端工作区节点（docs/cloud-claude-code.md §5.1–§5.2）。手工部署，不归在线更新管。
#   docker build -t chisabot-cloudnode:2.1.165 deploy/cloud-node
#   docker build -t chisabot-cloudnode-sync:0.18.1 deploy/cloud-node/sync      # 电脑文件夹同步的边车
#   CHISABOT_SERVER=https://你的域名:8443 CHISABOT_PAIR_CODE=cbp_xxx docker compose -f deploy/cloud-node/compose.yaml up -d
#   sudo sh deploy/cloud-node/firewall.sh <网桥网段>     # 丢弃到私有网段和主机的流量
# 没有 docker.sock、没有 host 网络、不发布任何端口；只出公网（连 ChisaBot 也走公网地址）。
name: chisabot-cloudnode
services:
  cloudnode:
    image: chisabot-cloudnode:${CLOUDNODE_TAG:-2.1.165}
    container_name: chisabot-cloudnode
    restart: unless-stopped
    environment:
      CHISABOT_SERVER: ${CHISABOT_SERVER:?set CHISABOT_SERVER}
      CHISABOT_PAIR_CODE: ${CHISABOT_PAIR_CODE:-}
      CHISABOT_NODE_NAME: ${CHISABOT_NODE_NAME:-云端工作区}
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2
    mem_limit: 4g
    pids_limit: 512
    volumes:
      - home:/home/agent
      - workspace:/workspace
      # 电脑文件夹同步（§5.3）：节点写公钥，读边车的主机公钥
      - sync-keys:/sync-keys
      - sync-pub:/sync-pub:ro
    networks: [cloudnode]
    # 默认公共 DNS；主机有只劫持 Claude 域名的 TUN DNS 时设 CLOUDNODE_DNS（firewall.sh 用同一个变量放行）
    dns: ["${CLOUDNODE_DNS:-1.1.1.1}"]
  # 同步边车（docs/cloud-claude-code.md §5.3）：和节点共用网络命名空间，sshd 只听 127.0.0.1:2222，不发布端口；
  # 只挂工作区卷的 projects/（不挂 home：碰不到 Claude 凭据）。电脑经 /api/devices/agent/sync-tunnel 隧道进来。
  cloudnode-sync:
    image: chisabot-cloudnode-sync:${CLOUDNODE_SYNC_TAG:-0.18.1}
    container_name: chisabot-cloudnode-sync
    restart: unless-stopped
    network_mode: "service:cloudnode"
    depends_on: [cloudnode]
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    volumes:
      - type: volume
        source: workspace
        target: /workspace/projects
        volume:
          subpath: projects
      - sync-keys:/sync-keys:ro
      - sync-pub:/sync-pub
      - sync-host:/sshhost
      - sync-state:/home/agent/.mutagen
networks:
  cloudnode:
    external: true
    name: ${CLOUDNODE_NETWORK:-chisabot-cloudnode-net}
volumes:
  home:
  workspace:
  sync-keys:
  sync-pub:
  sync-host:
  sync-state:
