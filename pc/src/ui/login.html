<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
<title>登录 ChisaBot</title>
<link rel="stylesheet" href="skyglass-tokens.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="login.css" />
<link rel="stylesheet" href="chrome.css" />
<script src="chrome.js"></script>
</head>
<body class="login-page">
<!--
  本机登录页（PC：src/ui/login.html；Android 0.1.13 起是原生登录页，不再共用这份）。
  不是服务器发来的网页：服务器地址在这里填写并保存在本机。模板 F（DESIGN.md §12）：天空上居中一张 L1 玻璃卡片。
-->
<main class="login">
  <form id="form" class="auth-card login-card" autocomplete="on" novalidate>
    <div class="mark enter" aria-hidden="true"><img src="logo.png" alt="" width="64" height="64" draggable="false" /></div>
    <h1 class="t-h1 center enter enter-2">登录 ChisaBot</h1>
    <p class="t-sub center enter enter-2" id="sub">连接到你的 ChisaBot 服务器</p>

    <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>

    <!-- 扫码绑定（DESIGN.md §33）：只有 Android 宿主提供扫码时显示（PC 上隐藏）。 -->
    <div class="scan enter enter-3 hidden" id="scanBlock">
      <button id="scanBtn" class="btn lg block" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 8h3v3H8zM13 13h3v3h-3zM13 8h3M8 13v3"/></svg>扫码绑定
      </button>
      <p class="hint center scan-hint" id="scanHint">在电脑上打开 ChisaBot 网页，进入「设置 → 设备 → 绑定手机」，扫描那里的二维码</p>
      <div id="scanError" class="alert hidden" role="alert"></div>
      <p class="step hint center hidden" id="scanStep" aria-live="polite">&nbsp;</p>
      <div class="divider" role="separator"><span>或使用账号密码登录</span></div>
    </div>

    <div class="fields enter enter-3">
      <div class="field" id="serverField">
        <label for="server">服务器地址</label>
        <div class="combo" id="combo">
          <input id="server" class="input" placeholder="chisabot.example.com:8443" required inputmode="url" autocomplete="url" spellcheck="false" autocapitalize="none" aria-describedby="serverHint" aria-autocomplete="list" aria-controls="history" />
          <button id="historyBtn" class="combo-btn hidden" type="button" aria-label="最近用过的服务器" aria-haspopup="listbox" aria-expanded="false" title="最近用过的服务器">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5.5 8 4.5 4.5L14.5 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <ul id="history" class="history" role="listbox" aria-label="最近用过的服务器" hidden></ul>
        </div>
        <span class="hint" id="serverHint">你在浏览器里打开 ChisaBot 的地址，会保存在这台设备上。</span>
        <span class="field-error hidden" id="serverError" role="alert"></span>
      </div>

      <div class="field">
        <label for="user">账号</label>
        <input id="user" class="input" autocomplete="username" required spellcheck="false" autocapitalize="none" maxlength="64" />
      </div>

      <div class="field">
        <label for="pass">密码</label>
        <div class="pw">
          <input id="pass" class="input" type="password" autocomplete="current-password" required maxlength="1024" />
          <button id="toggle" class="pw-toggle" type="button" aria-label="显示密码" aria-pressed="false">显示</button>
        </div>
        <span class="field-error hidden" id="passError" role="alert"></span>
      </div>

      <label class="check" for="remember">
        <input id="remember" type="checkbox" checked />
        <span class="box" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="m3.5 8.5 3 3 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="check-text">记住登录<small>30 天内打开直接进入；不保存密码</small></span>
      </label>

      <div id="err" class="alert hidden" role="alert"></div>

      <button id="submit" class="btn lg block" type="submit">登录</button>
      <p class="step hint center" id="step" aria-live="polite">&nbsp;</p>
    </div>
  </form>
  <p class="foot hint center" id="foot"></p>
</main>
<!-- 无边框窗口的拖动带和窗口按钮（DESIGN.md §91）：只有最小化 + 关闭（登录窗不能最大化 / 改大小）。放在表单后面，Tab 顺序不变。 -->
<div class="win-bar">
  <div class="win-ctrls" role="group" aria-label="窗口">
    <button class="win-ctrl" data-win="minimize" type="button" aria-label="最小化" title="最小化">
      <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5.5h8" stroke="currentColor" stroke-linecap="round" stroke-width="1.2"/></svg>
    </button>
    <button class="win-ctrl is-close" data-win="close" type="button" aria-label="关闭" title="关闭">
      <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-linecap="round" stroke-width="1.2"/></svg>
    </button>
  </div>
</div>
<script src="sky.js"></script>
<script src="ui.js"></script>
<script src="login.js"></script>
</body>
</html>
