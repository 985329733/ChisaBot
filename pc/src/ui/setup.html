<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
<title>ChisaBot PC · 连接到你的 ChisaBot</title>
<link rel="stylesheet" href="skyglass-tokens.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="setup.css" />
</head>
<body class="setup-page">
<!-- 模板 F（DESIGN.md §12）：没有外壳，天空上居中一张 L1 玻璃卡片，和网页登录页同一个样子。 -->
<main class="setup">
  <form id="form" class="auth-card setup-card" autocomplete="on" novalidate>
    <img class="orb enter" src="../../assets/icon.png" alt="" width="52" height="52" />
    <h1 class="t-h1 center enter enter-2">连接到你的 ChisaBot</h1>
    <p class="t-sub center enter enter-2">登录后，这台电脑会出现在 偏好设置 → 设备 里。所有远程能力默认关闭。</p>
    <div class="fields enter enter-3">
      <div id="err" class="alert hidden" role="alert"></div>
      <div class="field">
        <label for="server">服务器地址</label>
        <input id="server" class="input" placeholder="https://chisabot.example.com:8443" required inputmode="url" spellcheck="false" />
        <span class="hint">就是你在浏览器里打开 ChisaBot 的地址（你自己或管理员部署的服务器）。</span>
      </div>
      <div class="field">
        <label for="user">账号</label>
        <input id="user" class="input" autocomplete="username" required spellcheck="false" />
      </div>
      <div class="field">
        <label for="pass">密码</label>
        <input id="pass" class="input" type="password" autocomplete="current-password" required />
      </div>
      <div class="field">
        <label for="name">这台电脑的名字</label>
        <input id="name" class="input" maxlength="64" />
      </div>
      <button id="submit" class="btn lg block" type="submit">登录并连接</button>
      <p class="hint center foot">密码只用来登录这一次，不会保存。之后这台电脑用自己的设备令牌连接（Windows 加密保存，可随时在网页上撤销）。</p>
    </div>
  </form>
  <section id="done" class="auth-card setup-card hidden" aria-live="polite">
    <div class="ok-ic enter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
    <h1 class="t-h1 center enter enter-2">已连接</h1>
    <p class="t-sub center enter enter-2" id="doneText"></p>
    <button id="finish" class="btn lg block enter enter-3" type="button">打开 ChisaBot</button>
  </section>
</main>
<script src="sky.js"></script>
<script src="ui.js"></script>
<script src="setup.js"></script>
</body>
</html>
