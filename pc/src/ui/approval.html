<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
<title>ChisaBot 请求操作这台电脑</title>
<link rel="stylesheet" href="skyglass-tokens.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="dialog.css" />
</head>
<body class="dialog-page">
  <!-- 与网页「等待你审批」卡片同一套结构：警示图标 + 「谁 想 做什么」 + 代码块摘要 + 倒数 + 拒绝 / 允许。 -->
  <main class="auth-card dialog enter">
    <header class="dialog-h drag">
      <span class="sg-ico is-warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.5 8.5-8 9-4.5-.5-8-4-8-9V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg></span>
      <div class="dialog-ht">
        <div class="t-eyebrow" id="eyebrow">ChisaBot · 需要你确认</div>
        <div class="dialog-title" id="title">机器人请求操作这台电脑</div>
      </div>
    </header>
    <pre class="dialog-code mono" id="summary"></pre>
    <div class="dialog-meta"><span id="countdown" aria-live="off"></span><span id="where">也可以在网页 / 手机上处理</span></div>
    <footer class="dialog-f">
      <button id="deny" class="btn outline" type="button">拒绝</button>
      <button id="allow" class="btn" type="button">允许这一次</button>
    </footer>
  </main>
<script src="sky.js"></script>
<script src="ui.js"></script>
<script src="approval.js"></script>
</body>
</html>
